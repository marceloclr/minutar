<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINUTAR — Gerador de minutas do 3º JEFPSP/DF</title>

<!-- ==========================================================================
     [0] TEMA — aplicado antes do primeiro paint.
     Ler o tema depois do CSS produz um flash branco na abertura; num sistema
     que roda o dia inteiro numa secretaria, esse flash é ruído gratuito.
     ========================================================================== -->
<script>
(function () {
    try {
        var t = localStorage.getItem('minutar_tema');
        document.documentElement.setAttribute('data-tema', t === 'escuro' ? 'escuro' : 'claro');
    } catch (e) {
        /* localStorage bloqueado por política de grupo em máquina institucional.
           O tema padrão do atributo no <html> já cobre o caso. */
    }
})();
</script>

<style>
/* ==========================================================================
   TOKENS — uma cor por função, nunca por decoração.
   ========================================================================== */
:root {
    --fundo:        #f4f5f7;
    --superficie:   #ffffff;
    --superficie-2: #eceef1;
    --borda:        #d3d7de;
    --borda-forte:  #b3b9c4;
    --tinta:        #1b2027;
    --tinta-fraca:  #5b6472;

    --primaria:     #1f4e79;   /* institucional — ações principais            */
    --primaria-ct:  #ffffff;
    --sucesso:      #1d6b4f;   /* pacote válido, conferência aprovada         */
    --aviso:        #8a5a00;   /* segue, mas exige leitura                    */
    --perigo:       #a32f2a;   /* bloqueia                                    */
    --neutro:       #4a5260;   /* informação sem carga                        */

    --raio:   8px;
    --sombra: 0 1px 2px rgba(20, 25, 35, .06), 0 4px 14px rgba(20, 25, 35, .06);
    /* Espelha dados/formatacao.json. A prévia precisa parecer com o que sai no
       .docx; se divergirem, o assistente confere uma coisa e assina outra. */
    --serif:  Cambria, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
    --recuo-corpo: 1.25cm;
    --sans:   system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:   ui-monospace, "Cascadia Code", "Consolas", monospace;

    /* Tons suaves só para diferenciar cartão de modelo à distância. */
    --cartao1-fundo: #eaf2f8; --cartao1-borda: #9fc0dc;
    --cartao2-fundo: #eaf5ef; --cartao2-borda: #9ccbad;
    --cartao3-fundo: #faf3e6; --cartao3-borda: #d9bb84;
    --cartao4-fundo: #f2eef8; --cartao4-borda: #bfabd6;
}

html[data-tema="escuro"] {
    --fundo:        #14181e;
    --superficie:   #1b2028;
    --superficie-2: #232a34;
    --borda:        #2f3742;
    --borda-forte:  #46505e;
    --tinta:        #e6e9ee;
    --tinta-fraca:  #9aa4b2;

    --primaria:     #7aa7d0;
    --primaria-ct:  #101419;
    --sucesso:      #6fbb99;
    --aviso:        #d9a441;
    --perigo:       #e08a83;
    --neutro:       #9aa4b2;

    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .35);

    --cartao1-fundo: #182531; --cartao1-borda: #3d5b78;
    --cartao2-fundo: #16261e; --cartao2-borda: #3c6a4c;
    --cartao3-fundo: #2a2317; --cartao3-borda: #7a6032;
    --cartao4-fundo: #221d2b; --cartao4-borda: #5e4b78;
}

*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
}

/* --- Cabeçalho ---------------------------------------------------------- */
.topo {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: var(--superficie);
    border-bottom: 1px solid var(--borda);
    position: sticky; top: 0; z-index: 10;
}
.topo h1 { margin: 0; font-size: 17px; letter-spacing: .5px; font-weight: 700; }
.topo .sub { color: var(--tinta-fraca); font-size: 12.5px; }
.topo .espaco { flex: 1; }

.envoltorio { max-width: 980px; margin: 28px auto 80px; padding: 0 24px; }

/* --- Cartões ------------------------------------------------------------ */
.cartao {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 22px 24px;
    margin-bottom: 20px;
}
.cartao > h2 {
    margin: 0 0 4px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
}
.cartao > .legenda { margin: 0 0 18px; color: var(--tinta-fraca); font-size: 13.5px; }
.sobrancelha {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--tinta-fraca);
    display: block; margin-bottom: 6px;
}

/* --- Botões ------------------------------------------------------------- */
.btn {
    font: inherit; font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--raio);
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--primaria); color: var(--primaria-ct);
    transition: filter .15s, transform .08s;
}
.btn:hover  { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.secundario {
    background: var(--superficie-2); color: var(--tinta);
    border-color: var(--borda-forte);
}
.btn:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.linha-btn { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* --- Tooltip: obrigatório em todo controle ------------------------------ */
.dica {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--superficie-2); color: var(--tinta-fraca);
    border: 1px solid var(--borda-forte);
    font-size: 11px; font-weight: 700; cursor: help;
    position: relative; vertical-align: middle;
}
.dica > .dica-corpo {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    width: max-content; max-width: 330px;
    background: var(--tinta); color: var(--fundo);
    padding: 9px 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 400; line-height: 1.45;
    text-align: left; z-index: 50;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
}
.dica:hover > .dica-corpo, .dica:focus > .dica-corpo { display: block; }

/* --- Selos de proveniência --------------------------------------------- */
.selo {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .4px;
    border: 1px solid currentColor; vertical-align: middle;
}
.selo-curado   { color: var(--primaria); }
.selo-digitado { color: var(--sucesso);  }
.selo-derivado { color: var(--neutro);   }
.selo-pendente { color: var(--perigo);   }
.selo-rascunho { color: var(--aviso);    }

/* --- Diagnóstico (arnês) ------------------------------------------------ */
.diag { font-family: var(--mono); font-size: 12.5px; }
.diag .ok    { color: var(--sucesso); }
.diag .falha { color: var(--perigo); font-weight: 700; }
.diag ol { margin: 8px 0 0; padding-left: 22px; }
.diag li { margin-bottom: 3px; }

.aviso-caixa {
    border-left: 3px solid var(--aviso);
    background: var(--superficie-2);
    padding: 12px 16px; border-radius: 0 var(--raio) var(--raio) 0;
    font-size: 13.5px; margin-top: 16px;
}

/* --- Prévia: folha A4 na tela ------------------------------------------ */
.folha {
    background: #fff; color: #000;
    font-family: var(--serif); font-size: 14pt; line-height: 1.5;
    /* A4 menos as margens da vara, nas proporções reais */
    width: 100%; max-width: 720px; margin: 0 auto;
    padding: 2.5cm 2cm 2.5cm 3cm;
    border: 1px solid var(--borda);
    box-shadow: var(--sombra);
}
.folha p { margin: 0 0 10pt; text-align: justify; }
.folha p.est-corpo           { text-align: justify; margin-bottom: 6pt; text-indent: var(--recuo-corpo); }
.folha p.est-tituloCentro    { text-align: center; font-weight: 700; margin-bottom: 0; }
.folha p.est-subtituloCentro { text-align: center; margin-bottom: 10pt; }
.folha p.est-autuacao        { text-align: left; margin-bottom: 6pt; }
.folha p.est-vistos          { text-align: left; font-weight: 700; margin: 12pt 0; }
.folha p.est-secao           { text-align: left; font-weight: 700; margin: 14pt 0 8pt; }
.folha p.est-subsecao        { font-weight: 700; margin: 12pt 0 6pt; }
.folha p.est-alinea          { margin-left: 1cm; text-indent: -1cm; }
.folha p.est-fecho           { margin: 12pt 0; }
.folha p.est-assinatura      { text-align: center; margin: 12pt 0 0; }
.folha p.est-vazio           { margin: 0; min-height: 12pt; }

/* --- Campos do formulário ------------------------------------------------ */
.campo { margin-bottom: 16px; }
.campo label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
.campo .obrig { color: var(--perigo); }
.campo input[type="text"], .campo input[type="date"], .campo input[type="number"],
.campo select, .campo textarea {
    font: inherit; font-size: 14px;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--borda-forte);
    border-radius: var(--raio);
    background: var(--superficie);
    color: var(--tinta);
}
.campo input:focus, .campo select:focus, .campo textarea:focus {
    outline: 2px solid var(--primaria); outline-offset: 1px;
}
.campo textarea { min-height: 72px; resize: vertical; }
.campo .campo-multipla label {
    display: flex; align-items: center; gap: 6px;
    font-weight: 400; font-size: 14px; margin-bottom: 4px;
}
.campo.pendente input, .campo.pendente select, .campo.pendente textarea,
.campo.invalido input, .campo.invalido select, .campo.invalido textarea { border-color: var(--perigo); }
.campo-erro { display: block; color: var(--perigo); font-size: 12px; margin-top: 4px; min-height: 15px; }

.pendencias { margin: 6px 0 0; padding-left: 20px; font-size: 13.5px; }
.pendencias li { margin-bottom: 4px; }

/* --- Grupos de campos: só organização visual, sempre à vista ------------- */
.grupo-campos {
    border: 1px solid var(--borda); border-radius: var(--raio);
    padding: 4px 16px; margin-bottom: 12px; background: var(--superficie);
}
.grupo-campos > h3 {
    margin: 0; padding: 10px 0; font-weight: 600; font-size: 13.5px;
    display: flex; align-items: center; gap: 8px;
}

/* Lado a lado, aproveitando a largura — cada campo numa coluna de ~240px
   pra cima; textoLongo e multipla (às vezes compridos) ocupam a linha
   inteira em vez de espremer numa coluna. */
.grade-campos {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 4px 20px;
    padding-top: 4px; padding-bottom: 12px;
}
.grade-campos .campo { margin-bottom: 12px; }
.grade-campos .campo-tipo-textoLongo, .grade-campos .campo-tipo-multipla {
    grid-column: 1 / -1;
}

/* --- Vitrine -------------------------------------------------------------- */
.vitrine-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.modelo-cartao {
    border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px;
    background: var(--superficie-2);
    display: flex; flex-direction: column; gap: 10px;
}
.modelo-cartao h3 { margin: 0; font-size: 14.5px; }
.modelo-cartao ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--tinta-fraca); }
.modelo-cartao .linha-btn { margin-top: auto; }
.modelo-cartao.cor-1 { background: var(--cartao1-fundo); border-color: var(--cartao1-borda); }
.modelo-cartao.cor-2 { background: var(--cartao2-fundo); border-color: var(--cartao2-borda); }
.modelo-cartao.cor-3 { background: var(--cartao3-fundo); border-color: var(--cartao3-borda); }
.modelo-cartao.cor-4 { background: var(--cartao4-fundo); border-color: var(--cartao4-borda); }
</style>
</head>

<body>

<header class="topo">
    <div>
        <h1>MINUTAR</h1>
        <div class="sub">3º Juizado Especial da Fazenda Pública e Saúde Pública do DF</div>
    </div>
    <div class="espaco"></div>
    <button class="btn secundario" id="btnTema"
            title="Alterna entre o tema claro e o escuro. A escolha fica gravada neste computador e vale para as próximas aberturas.">
        Tema
    </button>
</header>

<main class="envoltorio" id="principal"></main>

<script>
"use strict";

/* ==========================================================================
   [1] CONFIG — versões e limites. Um lugar só.
   ========================================================================== */
const CONFIG = {
    nome: 'MINUTAR',
    versao: '0.1.0',
    orgaoPadrao: '3jefp_df',

    /* Versões de esquema. Sobem quando o formato muda de forma que um
       arquivo antigo não pode mais ser lido adivinhando o significado. */
    esquemaModelo: 1,
    esquemaPersistencia: 1,
    formatoTransferencia: 'minutar/minuta',
    formatoTransferenciaVersao: 1,

    /* Data fixa nas entradas do ZIP. Sem isso o JSZip carimba o relógio e
       dois downloads do mesmo documento produzem bytes diferentes — o que
       impede conferir que a geração é determinística. */
    dataZipFixa: new Date(Date.UTC(2020, 0, 1, 0, 0, 0))
};

/* ==========================================================================
   [2] PROV — taxonomia de proveniência.
   Numa peça judicial, saber de onde veio cada palavra não é luxo. A legenda
   da interface é gerada deste objeto, então nunca destoa do que os selos dizem.
   ========================================================================== */
const PROV = {
    CURADO:   { classe: 'selo-curado',   rotulo: 'Curado',
                ajuda: 'Texto fixo do modelo oficial, redigido e conferido pelo gabinete. Não muda conforme o preenchimento.' },
    DIGITADO: { classe: 'selo-digitado', rotulo: 'Digitado',
                ajuda: 'Valor informado por você neste formulário. É o que personaliza a minuta para este processo.' },
    DERIVADO: { classe: 'selo-derivado', rotulo: 'Derivado',
                ajuda: 'Calculado pelo sistema a partir de outro valor — data por extenso, nome sintético das partes, letra da alínea.' },
    PENDENTE: { classe: 'selo-pendente', rotulo: 'Pendente',
                ajuda: 'Espaço do modelo que ficou sem valor. Enquanto houver pendência, o arquivo não é gerado: peça com lacuna não vai para os autos.' },
    RASCUNHO: { classe: 'selo-rascunho', rotulo: 'Rascunho',
                ajuda: 'Texto vindo de modelo não-oficial, criado localmente. Não passou pela curadoria do gabinete — confira antes de usar.' }
};

/* ==========================================================================
   [3] U — utilitários.
   ========================================================================== */
const U = {

    /* --- Texto ---------------------------------------------------------- */

    /* Escape para HTML. Todo valor digitado passa por aqui antes de virar tela. */
    esc(s) {
        return String(s == null ? '' : s)
            .split('&').join('&amp;')
            .split('<').join('&lt;')
            .split('>').join('&gt;')
            .split('"').join('&quot;')
            .split("'").join('&#39;');
    },

    /* O que o padrão XML 1.0 proíbe, tirado e contado. Previa chama isto
       também — sem isso, a tela mostraria um caractere que o .docx descarta,
       e prévia e arquivo divergiriam no que mais importa: o texto. */
    semControle(s) {
        const bruto = String(s == null ? '' : s);
        let limpo = '', removidos = 0;

        for (let i = 0; i < bruto.length; i++) {
            const c = bruto.charCodeAt(i);

            /* Par substituto bem formado (emoji etc.): copia os dois de uma vez. */
            if (c >= 0xD800 && c <= 0xDBFF) {
                const p = bruto.charCodeAt(i + 1);
                if (p >= 0xDC00 && p <= 0xDFFF) { limpo += bruto[i] + bruto[i + 1]; i++; continue; }
                removidos++; continue;             /* alto solitário  */
            }
            if (c >= 0xDC00 && c <= 0xDFFF) { removidos++; continue; }   /* baixo solitário */

            /* Permitidos em XML 1.0: tab, LF, CR e tudo a partir de 0x20. */
            const permitido = c === 0x09 || c === 0x0A || c === 0x0D || (c >= 0x20 && c !== 0xFFFE && c !== 0xFFFF);
            if (!permitido) { removidos++; continue; }

            limpo += bruto[i];
        }
        return { texto: limpo, removidos };
    },

    /* Escape para XML do OOXML. O caso real: um U+000B (VT) colado do editor
       do PJe invalida o pacote inteiro, e o Word responde apenas "conteúdo
       ilegível" — mensagem que não ajuda ninguém a descobrir a causa.
       CONTAMOS o que foi retirado: a contagem sobe até a interface. */
    escXml(s) {
        const r = U.semControle(s);
        U.escXml.removidos += r.removidos;

        return r.texto
            .split('&').join('&amp;')
            .split('<').join('&lt;')
            .split('>').join('&gt;')
            .split('"').join('&quot;')
            .split("'").join('&apos;');
    },

    /* --- Datas ---------------------------------------------------------- */

    MESES: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
            'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],

    /* "10 de setembro de 2026" — como a peça assina. */
    dataExtenso(d) {
        const dt = (d instanceof Date) ? d : U.dataDeIso(d);
        if (!dt) return null;
        return dt.getDate() + ' de ' + U.MESES[dt.getMonth()] + ' de ' + dt.getFullYear();
    },

    /* "9h30" (input type="time" devolve "09:30") — minuto ":00" vira só "9h",
       como a redação jurídica escreve, não "9h00". */
    horaExtenso(s) {
        const m = /^(\d{2}):(\d{2})$/.exec(String(s || ''));
        if (!m) return null;
        const h = parseInt(m[1], 10);
        return m[2] === '00' ? h + 'h' : h + 'h' + m[2];
    },

    dataDeIso(s) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
        if (!m) return null;
        const a = +m[1], me = +m[2], di = +m[3];
        const dt = new Date(a, me - 1, di);
        /* 31/02 vira 03/03 silenciosamente no construtor. Conferimos a volta. */
        if (dt.getFullYear() !== a || dt.getMonth() !== me - 1 || dt.getDate() !== di) return null;
        return dt;
    },

    isoDeData(d) {
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    },

    /* Carimbo W3CDTF exigido pelo docProps/core.xml. */
    carimboUtc(d) {
        const p = n => String(n).padStart(2, '0');
        return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) +
               'T' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + 'Z';
    },

    /* --- Números ---------------------------------------------------------- */

    /* "R$ 1.234,56" — sem depender de Intl/toLocaleString, que varia de
       suporte por ambiente (o vm de tools/conferir-docx.mjs não tem ICU
       completo garantido). Só para valor não-negativo, o único caso real. */
    moeda(v) {
        const n = Number(v);
        if (isNaN(n)) return String(v);
        const [inteiro, centavos] = Math.abs(n).toFixed(2).split('.');
        const comPontos = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return (n < 0 ? '-R$ ' : 'R$ ') + comPontos + ',' + centavos;
    },

    /* --- Nomes de arquivo ----------------------------------------------- */

    /* Nome sempre começa por letra: um '-' inicial faz ferramentas de linha de
       comando tratarem o arquivo como opção. E '/' ou ':' quebram o download
       no Windows. */
    slug(s) {
        const semAcento = String(s == null ? '' : s)
            .normalize('NFD').replace(/[̀-ͯ]/g, '');
        const limpo = semAcento.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        return /^[A-Za-z]/.test(limpo) ? limpo : ('M_' + limpo);
    },

    /* --- Impressão digital ---------------------------------------------- */

    /* FNV-1a: barato, estável e suficiente para detectar que um conteúdo mudou
       entre uma exportação e a base corrente. Não é hash criptográfico e não
       está sendo usado como tal. */
    digital(o) {
        const s = JSON.stringify(o === undefined ? null : o);
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
        return h.toString(16).padStart(8, '0');
    },

    /* --- DOM ------------------------------------------------------------ */

    dica(texto) {
        return '<span class="dica" tabindex="0" role="note">i<span class="dica-corpo">' +
               U.esc(texto) + '</span></span>';
    },

    selo(tipo) {
        const p = PROV[tipo] || PROV.PENDENTE;
        return '<span class="selo ' + p.classe + '" title="' + U.esc(p.ajuda) + '">' +
               U.esc(p.rotulo) + '</span>';
    },

    baixar(blob, nome) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        /* Revogar de imediato aborta o download em alguns navegadores. */
        setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
};
U.escXml.removidos = 0;

/* ==========================================================================
   [4] MODELOS — base oficial, injetada pelo build e congelada.
   Um bug de interface não pode corromper a curadoria dentro da sessão: a
   única forma de editar um modelo oficial é duplicá-lo como rascunho.
   ========================================================================== */
const MODELOS = /*@MODELOS@*/ [] /*@FIM@*/;

/* ==========================================================================
   [5] DADOS — formatação, órgãos, catálogo e fundamentos. Injetados pelo build.
   ========================================================================== */
const DADOS = /*@DADOS@*/ {} /*@FIM@*/;

(function congelar(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
        Object.freeze(o);
        Object.keys(o).forEach(k => congelar(o[k]));
    }
    return o;
})(MODELOS);
(function congelar(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
        Object.freeze(o);
        Object.keys(o).forEach(k => congelar(o[k]));
    }
    return o;

/* ==========================================================================
   [8] COND — avaliador de condições sobre os valores do formulário.
   Os mesmos operadores que tools/validar-modelos.mjs já valida na curadoria;
   aqui só se decide o valor-verdade, a checagem de forma já aconteceu antes
   do build. Sem "quando", o nó é sempre incluído.
   ========================================================================== */
const Cond = {

    avaliar(cond, valores) {
        if (!cond) return true;
        if (cond.todos) return cond.todos.every(c => Cond.avaliar(c, valores));
        if (cond.algum) return cond.algum.some(c => Cond.avaliar(c, valores));
        if (cond.nao)   return !Cond.avaliar(cond.nao, valores);

        const v = valores ? valores[cond.campo] : undefined;

        if ('preenchido' in cond) {
            const tem = v !== undefined && v !== null && v !== '';
            return cond.preenchido ? tem : !tem;
        }
        if ('igual' in cond)     return Cond.iguais(v, cond.igual);
        if ('diferente' in cond) return !Cond.iguais(v, cond.diferente);
        if ('umDe' in cond)      return (cond.umDe || []).some(x => Cond.iguais(v, x));
        if ('contem' in cond)    return Array.isArray(v) && v.indexOf(cond.contem) >= 0;
        if ('maiorQue' in cond)  return Cond.compara(v, cond.maiorQue) > 0;
        if ('menorQue' in cond)  return Cond.compara(v, cond.menorQue) < 0;
        if ('entre' in cond) {
            const [a, b] = cond.entre;
            return Cond.compara(v, a) >= 0 && Cond.compara(v, b) <= 0;
        }
        return false;
    },

    /* Booleano compara por Boolean(), não por ===: um campo "booleano" pode
       chegar como valor JS puro; string/número comparam por igualdade estrita. */
    iguais(a, b) {
        if (typeof a === 'boolean' || typeof b === 'boolean') return Boolean(a) === Boolean(b);
        return a === b;
    },

    /* Data ISO compara por data real (não por string); número e moeda por valor. */
    compara(v, alvo) {
        const dv = U.dataDeIso(v), da = U.dataDeIso(alvo);
        if (dv && da) return dv.getTime() - da.getTime();
        return Number(v) - Number(alvo);
    }
};

/* ==========================================================================
   [9] CAMPOS — um controle de formulário por tipo de campo.
   Cada função aqui é pura o bastante para testar sem DOM, exceto lerValor
   (lê de volta o que o assistente digitou) e renderizar (produz HTML).
   ========================================================================== */
const Campos = {

    /* Sem mostrarQuando, o campo está sempre visível. Campo escondido nunca
       entra em obrigatorio/pendências — ver Form.pendencias. */
    visivel(campo, valores) {
        return Cond.avaliar(campo.mostrarQuando, valores);
    },

    /* "" conta como vazio para todo tipo; array vazio só para "multipla";
       booleano só é vazio se ainda não foi respondido (nem sim, nem não) —
       um false digitado é uma resposta, não uma lacuna. */
    vazio(campo, valor) {
        if (campo.tipo === 'multipla') return !Array.isArray(valor) || valor.length === 0;
        return valor == null || valor === '';
    },

    renderizar(campo, valor) {
        const id = 'campo_' + campo.id;
        const obrig = campo.obrigatorio ? ' <span class="obrig" title="Campo obrigatório">*</span>' : '';
        let controle;

        switch (campo.tipo) {
            case 'textoLongo':
                controle = '<textarea id="' + id + '" name="' + U.esc(campo.id) + '">' + U.esc(valor || '') + '</textarea>';
                break;

            case 'data':
                controle = '<input type="date" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '">';
                break;

            case 'numero':
            case 'moeda': {
                const passo = campo.tipo === 'moeda' ? ' step="0.01"' : '';
                const min = campo.minimo != null ? ' min="' + campo.minimo + '"' : '';
                const max = campo.maximo != null ? ' max="' + campo.maximo + '"' : '';
                controle = '<input type="number" id="' + id + '" name="' + U.esc(campo.id) + '"' + passo + min + max +
                           ' value="' + U.esc(valor == null ? '' : valor) + '">';
                break;
            }

            case 'selecao': {
                const opcoes = (campo.opcoes || []).map(o =>
                    '<option value="' + U.esc(o.valor) + '"' + (valor === o.valor ? ' selected' : '') + '>' +
                    U.esc(o.rotulo) + '</option>').join('');
                controle = '<select id="' + id + '" name="' + U.esc(campo.id) + '">' +
                           '<option value="">— selecione —</option>' + opcoes + '</select>';
                break;
            }

            /* Booleano é <select>, não checkbox: um checkbox desmarcado é
               indistinguível de "ainda não respondido" e resolveria em false
               sem o assistente ter confirmado nada — inventar fato jurídico
               (ex.: "não houve tutela") só porque ninguém tocou no campo. */
            case 'booleano': {
                const marcado = v => (valor === true && v === 'sim') || (valor === false && v === 'nao');
                controle = '<select id="' + id + '" name="' + U.esc(campo.id) + '">' +
                    '<option value=""' + (valor == null ? ' selected' : '') + '>— selecione —</option>' +
                    '<option value="sim"' + (marcado('sim') ? ' selected' : '') + '>Sim</option>' +
                    '<option value="nao"' + (marcado('nao') ? ' selected' : '') + '>Não</option>' +
                    '</select>';
                break;
            }

            case 'multipla': {
                const marcados = Array.isArray(valor) ? valor : [];
                controle = '<div class="campo-multipla">' + (campo.opcoes || []).map(o =>
                    '<label><input type="checkbox" data-multipla="' + U.esc(campo.id) + '" value="' + U.esc(o.valor) + '"' +
                    (marcados.indexOf(o.valor) >= 0 ? ' checked' : '') + '> ' + U.esc(o.rotulo) + '</label>'
                ).join('') + '</div>';
                break;
            }

            case 'processo':
                controle = '<input type="text" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '" inputmode="numeric" maxlength="25" ' +
                           'placeholder="0000000-00.0000.0.00.0000" ' +
                           'pattern="\\d{7}-\\d{2}\\.\\d{4}\\.\\d\\.\\d{2}\\.\\d{4}">';
                break;

            /* Categoria (3) opcional subcategoria (+1) — LNN ou LNN.N, ex.
               F41.1. Não valida contra a tabela real da CID-10 (isso exigiria
               embarcar a tabela inteira); só o formato. */
            case 'cid':
                controle = '<input type="text" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '" maxlength="5" placeholder="A00.0" ' +
                           'pattern="[A-Za-z]\\d{2}(\\.\\d)?" style="text-transform:uppercase">';
                break;

            /* GGSSFFPPPP — 10 dígitos (Ministério da Saúde/SIGTAP). O 10º é
               dígito verificador (Módulo 11); não conferido aqui, só a
               quantidade de dígitos — mesma lógica do CNJ: formato agora,
               cálculo de dígito verificador em fase posterior. */
            case 'sigtap':
                controle = '<input type="text" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '" inputmode="numeric" maxlength="10" placeholder="0000000000" ' +
                           'pattern="\\d{10}">';
                break;

            case 'hora':
                controle = '<input type="time" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '">';
                break;

            default: /* texto, parte */
                controle = '<input type="text" id="' + id + '" name="' + U.esc(campo.id) + '" value="' +
                           U.esc(valor || '') + '">';
        }

        return '<div class="campo campo-tipo-' + campo.tipo + (campo._pendente ? ' pendente' : '') +
               '" data-campo="' + U.esc(campo.id) + '">' +
               '<label' + (campo.tipo !== 'multipla' ? ' for="' + id + '"' : '') + '>' + U.esc(campo.rotulo) + obrig +
               ' ' + U.dica(campo.ajuda) + '</label>' + controle +
               '<span class="campo-erro" id="erro_' + U.esc(campo.id) + '"></span></div>';
    },

    /* Insere separadores enquanto o assistente digita e barra o que não
       pode fazer parte do valor — cada tipo com sua própria máscara. Tipo
       sem máscara devolve o bruto sem alterar (é o caso comum). */
    mascarar(campo, bruto) {
        if (campo.tipo === 'processo') {
            const d = String(bruto || '').replace(/\D/g, '').slice(0, 20);
            let s = d.slice(0, 7);
            if (d.length > 7)  s += '-' + d.slice(7, 9);
            if (d.length > 9)  s += '.' + d.slice(9, 13);
            if (d.length > 13) s += '.' + d.slice(13, 14);
            if (d.length > 14) s += '.' + d.slice(14, 16);
            if (d.length > 16) s += '.' + d.slice(16, 20);
            return s;
        }
        if (campo.tipo === 'cid') {
            const s = String(bruto || '').toUpperCase();
            const letra = (s.match(/[A-Z]/) || [''])[0];
            if (!letra) return '';
            const digitos = s.replace(/[^0-9]/g, '').slice(0, 3);
            let r = letra + digitos.slice(0, 2);
            if (digitos.length > 2) r += '.' + digitos.slice(2, 3);
            return r;
        }
        if (campo.tipo === 'sigtap') {
            return String(bruto || '').replace(/\D/g, '').slice(0, 10);
        }
        return bruto;
    },

    /* Crítica ao vivo, por tipo — cada campo tratado conforme a natureza
       dele, para reduzir erro de digitação antes de chegar no documento.
       Vazio não é erro aqui: quem cobra campo vazio é Form.pendencias, só
       depois do primeiro clique em "Baixar". */
    validar(campo, valor) {
        if (valor == null || valor === '') return { valido: true, mensagem: '' };

        if (campo.tipo === 'processo') {
            const ok = /^\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}$/.test(valor);
            return ok ? { valido: true, mensagem: '' }
                      : { valido: false, mensagem: 'Formato incompleto — o padrão é NNNNNNN-DD.AAAA.J.TR.OOOO.' };
        }
        /* Só o formato (LNN ou LNN.N) — não confere contra a tabela real da
           CID-10, que este sistema não embarca. */
        if (campo.tipo === 'cid') {
            const ok = /^[A-Z]\d{2}(\.\d)?$/.test(valor);
            return ok ? { valido: true, mensagem: '' }
                      : { valido: false, mensagem: 'Formato esperado: uma letra e dois dígitos, com subcategoria opcional (ex.: F41.1).' };
        }
        /* 10 dígitos (Ministério da Saúde/SIGTAP) — dígito verificador não
           conferido, só a quantidade. */
        if (campo.tipo === 'sigtap') {
            const ok = /^\d{10}$/.test(valor);
            return ok ? { valido: true, mensagem: '' }
                      : { valido: false, mensagem: 'O código SIGTAP tem 10 dígitos.' };
        }
        if (campo.tipo === 'numero' || campo.tipo === 'moeda') {
            const n = Number(valor);
            if (isNaN(n)) return { valido: false, mensagem: 'Digite um número.' };
            if (campo.minimo != null && n < campo.minimo) return { valido: false, mensagem: 'Não pode ser menor que ' + campo.minimo + '.' };
            if (campo.maximo != null && n > campo.maximo) return { valido: false, mensagem: 'Não pode ser maior que ' + campo.maximo + '.' };
        }
        return { valido: true, mensagem: '' };
    },

    /* Lê de volta o valor digitado, já convertido para o tipo do campo. */
    lerValor(campo) {
        if (campo.tipo === 'multipla') {
            const marcados = [];
            document.querySelectorAll('[data-multipla="' + campo.id + '"]:checked')
                .forEach(el => marcados.push(el.value));
            return marcados;
        }
        const el = document.getElementById('campo_' + campo.id);
        if (!el) return undefined;
        if (campo.tipo === 'booleano') {
            if (el.value === 'sim') return true;
            if (el.value === 'nao') return false;
            return null;
        }
        if (campo.tipo === 'numero' || campo.tipo === 'moeda') return el.value === '' ? null : Number(el.value);
        return el.value;
    }
};

/* ==========================================================================
   [10] FORM — orquestra modelo.campos: monta, revalida mostrarQuando,
   junta valores e decide o que falta antes de gerar a peça.
   ========================================================================== */
const Form = {

    /* Junta o que já havia com o que está no DOM agora. Só sobrescreve
       campos presentes no modelo — nunca inventa nem apaga o resto do
       estado (relevante quando o modelo tem campo escondido no momento). */
    coletarValores(modelo, anterior) {
        const valores = Object.assign({}, anterior);
        (modelo.campos || []).forEach(c => {
            const v = Campos.lerValor(c);
            if (v !== undefined) valores[c.id] = v;
        });
        return valores;
    },

    /* Obrigatório, visível, vazio e NÃO derivado — a lista que bloqueia
       "Baixar" e vira a tabela de pendências. Campo escondido por
       mostrarQuando, ou calculado (derivado), nunca bloqueia: ninguém o
       digita, então não há o que cobrar do assistente. */
    pendencias(modelo, valores) {
        return (modelo.campos || []).filter(c =>
            c.obrigatorio && !c.derivado && Campos.visivel(c, valores) && Campos.vazio(c, valores[c.id]));
    },

    /* Campo sem "grupo" cai no grupo padrão "Dados do processo". */
    GRUPO_PADRAO: 'Dados do processo',

    /* Grupos são só organização visual (título + grade) — todos sempre à
       vista, sem clicar para abrir. O que muda com a pendência é só o selo
       no título do grupo, não se ele aparece ou não. */
    renderizarCampos(modelo, valores, pendentesIds) {
        const pend = pendentesIds || [];
        const visiveis = (modelo.campos || []).filter(c => !c.derivado && Campos.visivel(c, valores));
        const ordem = [], porGrupo = {};
        visiveis.forEach(c => {
            const g = c.grupo || Form.GRUPO_PADRAO;
            if (!porGrupo[g]) { porGrupo[g] = []; ordem.push(g); }
            porGrupo[g].push(c);
        });

        return ordem.map(g => {
            const doGrupo = porGrupo[g];
            const temPendente = doGrupo.some(c => pend.indexOf(c.id) >= 0);
            const campos = doGrupo.map(c => Campos.renderizar(
                Object.assign({}, c, { _pendente: pend.indexOf(c.id) >= 0 }), valores[c.id]
            )).join('');
            return '<section class="grupo-campos"><h3>' + U.esc(g) +
                   (temPendente ? ' ' + U.selo('PENDENTE') : '') + '</h3>' +
                   '<div class="grade-campos">' + campos + '</div></section>';
        }).join('');
    }
};

/* ==========================================================================
   [12] MARCADOR — parser inline de **negrito** e __itálico__, com escape \.
   Único caminho de código que decide o que é negrito — Previa e Ooxml não
   reimplementam isto, só desenham o run que sai daqui.

   resolverPlaceholder, se dado, é chamado com o conteúdo de cada {{...}}
   encontrado e devolve o valor já resolvido. Esse valor vira um run próprio,
   com o negrito/itálico correntes do texto ao redor, mas NUNCA é escaneado
   por este parser: um ** dentro de um valor digitado não abre nem fecha
   marcador. Sem resolverPlaceholder, {{...}} passa como texto literal.
   ========================================================================== */
const Marcador = {

    paraRuns(texto, resolverPlaceholder) {
        const t = String(texto == null ? '' : texto);
        const runs = [];
        let atual = '', negrito = false, italico = false, i = 0;

        const fechar = () => {
            if (atual !== '') runs.push({ texto: atual, negrito, italico });
            atual = '';
        };

        while (i < t.length) {
            if (t[i] === '\\' && '*_\\'.indexOf(t[i + 1]) >= 0) {
                atual += t[i + 1]; i += 2; continue;
            }
            if (t.slice(i, i + 2) === '**') { fechar(); negrito = !negrito; i += 2; continue; }
            if (t.slice(i, i + 2) === '__') { fechar(); italico = !italico; i += 2; continue; }
            if (resolverPlaceholder && t[i] === '{' && t[i + 1] === '{') {
                const fim = t.indexOf('}}', i + 2);
                if (fim >= 0) {
                    fechar();
                    const valor = resolverPlaceholder(t.slice(i + 2, fim).trim());
                    if (valor !== '') runs.push({ texto: valor, negrito, italico });
                    i = fim + 2;
                    continue;
                }
            }
            atual += t[i]; i += 1;
        }
        fechar();
        return runs;
    }
};

/* ==========================================================================
   [11] MONTAGEM — modelo + valores → IR.
   Uma função só decide o texto da peça; Previa e Ooxml são dois
   renderizadores burros da mesma estrutura, e nenhum dos dois contém regra
   de conteúdo. Nesta fase o "modelo" pode ser um objeto JS escrito à mão — o
   schema JSON de dados/modelos/ é Fase 3.
   ========================================================================== */
const Montagem = {

    montarDocumento(modelo, valores, opcoes) {
        const ctx = {
            valores: Montagem.aplicarDerivados(modelo.campos || [], valores || {}),
            orgao: (opcoes && opcoes.orgao) || {},
            magistrado: (opcoes && opcoes.magistrado) || '',
            hoje: (opcoes && opcoes.hoje) || new Date(),
            letras: {}
        };

        Montagem.atribuirLetras(modelo.corpo || [], ctx);

        const paragrafos = [];
        (modelo.corpo || []).forEach(no => Montagem.montarNo(no, ctx, paragrafos));
        return { paragrafos };
    },

    /* Campo com "derivado" nunca é digitado — Form nem o mostra (ver
       Form.renderizarCampos) — é calculado aqui a partir de outros campos já
       coletados, antes de qualquer texto ser resolvido. Os campos de origem
       continuam sendo os que bloqueiam "Baixar" quando vazios; o derivado
       nunca bloqueia nada, porque ninguém o preenche. */
    aplicarDerivados(campos, valores) {
        const comDerivados = Object.assign({}, valores);
        campos.forEach(c => {
            if (c.derivado) comDerivados[c.id] = Montagem.calcularDerivado(c.derivado, comDerivados);
        });
        return comDerivados;
    },

    calcularDerivado(d, valores) {
        if (d.tipo === 'tabela') {
            const chave = (d.origem || []).map(o => valores[o]).join('.');
            const achado = (d.tabela || {})[chave];
            return achado !== undefined ? achado : (d.padrao !== undefined ? d.padrao : null);
        }
        if (d.tipo === 'diasEntre') {
            const [de, ate] = d.origem || [];
            const a = U.dataDeIso(valores[de]), b = U.dataDeIso(valores[ate]);
            if (!a || !b) return null;
            return Math.round((b.getTime() - a.getTime()) / 86400000);
        }
        return null;
    },

    /* As letras são calculadas ANTES de montar qualquer parágrafo, e só a
       partir dos filhos que sobrevivem ao próprio "quando" — é assim que um
       item condicional excluído não deixa buraco na sequência (a, b, _, d).
       O modelo nunca escreve a letra: só referencia {{@alinea:id}}. */
    atribuirLetras(corpo, ctx) {
        corpo.forEach(no => {
            if (no.tipo !== 'grupoAlineas') return;
            let letra = 'a'.charCodeAt(0);
            (no.filhos || []).forEach(f => {
                if (!Cond.avaliar(f.quando, ctx.valores)) return;
                ctx.letras[f.id] = String.fromCharCode(letra);
                letra++;
            });
        });
    },

    montarNo(no, ctx, paragrafos) {
        if (!Cond.avaliar(no.quando, ctx.valores)) return;

        if (no.tipo === 'grupoAlineas') {
            (no.filhos || []).forEach(f => {
                if (ctx.letras[f.id] === undefined) return;
                Montagem.montarNo(f, ctx, paragrafos);
            });
            return;
        }

        let runs;
        if (no.partes) {
            runs = Montagem.runsDePartes(no.partes, ctx);
            if (!runs.length) return;
        } else {
            const texto = Montagem.textoDoNo(no, ctx);
            if (texto == null) return;
            runs = Marcador.paraRuns(texto, alvo => Montagem.resolverPlaceholder(alvo, ctx));
        }
        paragrafos.push({ id: no.id, estilo: no.estilo, destino: no.destino || 'peca', runs });
    },

    /* "partes": trechos fixos e escolhas alternados na mesma frase — para
       quando a variação está no meio do parágrafo, não no parágrafo inteiro.
       Cada parte vira seus próprios runs, resolvida e marcada de forma
       independente: um ** aberto numa parte precisa fechar na mesma parte,
       não atravessa para a próxima (limite aceito, documentado aqui). */
    runsDePartes(partes, ctx) {
        const runs = [];
        partes.forEach(parte => {
            let texto;
            if (typeof parte === 'string') texto = parte;
            else if (parte && parte.escolha) texto = Montagem.textoDaEscolha(parte.escolha, ctx);
            else texto = '';

            if (texto == null || texto === '') return;
            runs.push(...Marcador.paraRuns(texto, alvo => Montagem.resolverPlaceholder(alvo, ctx)));
        });
        return runs;
    },

    /* null distingue "sem texto, omitir" de "" (vazio deliberado) — mesma
       semântica de escolha.padrao validada no build. */
    textoDaEscolha(e, ctx) {
        const v = ctx.valores[e.campo];
        const caso = (e.casos || []).find(c => Cond.iguais(v, c.valor));
        if (caso) return caso.texto;
        return e.padrao == null ? null : e.padrao;
    },

    textoDoNo(no, ctx) {
        if (typeof no.texto === 'string') return no.texto;
        if (no.escolha) return Montagem.textoDaEscolha(no.escolha, ctx);
        return '';
    },

    resolverPlaceholder(alvo, ctx) {
        const [nome, filtro] = alvo.split('|').map(s => s && s.trim());
        if (nome.charAt(0) === '@') return Montagem.resolverSistema(nome.slice(1), ctx);
        return Montagem.aplicarFiltro(ctx.valores[nome], filtro);
    },

    resolverSistema(token, ctx) {
        const [chave, ref] = token.split(':');
        switch (chave) {
            case 'hoje':       return U.dataExtenso(ctx.hoje) || '';
            case 'local':      return ctx.orgao.local || '';
            case 'magistrado': return ctx.magistrado || '';
            case 'orgao':      return ctx.orgao.nomeCurto || '';
            case 'alinea':     return ctx.letras[ref] || '';
            default:           return '';
        }
    },

    /* Só os filtros já exercitados por algum modelo. Os demais listados em
       validar-modelos.mjs (percentual, extenso, cnj) entram com o conteúdo
       real que os use — implementar sem um uso concreto para conferir
       contra é inventar comportamento. */
    aplicarFiltro(v, filtro) {
        if (v == null || v === '') return '';
        switch (filtro) {
            case 'dataExtenso': return U.dataExtenso(v) || '';
            case 'horaExtenso': return U.horaExtenso(v) || '';
            case 'maiusculas':  return String(v).toUpperCase();
            case 'sintetico':   return (v && typeof v === 'object' && v.sintetico) || String(v);
            case 'moeda':       return U.moeda(v);
            default:            return String(v);
        }
    }
};

/* ==========================================================================
   [13] PREVIA — IR → HTML, na folha A4. Segundo renderizador da mesma
   estrutura que o Ooxml consome; nenhuma regra de conteúdo mora aqui.
   ========================================================================== */
const Previa = {

    renderizar(doc) {
        return (doc.paragrafos || []).filter(p => p.destino !== 'instrucao').map(p => {
            const corpo = (p.runs || []).map(r => {
                let t = U.esc(U.semControle(r.texto).texto).split('\n').join('<br>');
                if (r.negrito) t = '<strong>' + t + '</strong>';
                if (r.italico) t = '<em>' + t + '</em>';
                return t;
            }).join('');
            return '<p class="est-' + U.esc(p.estilo) + '">' + (corpo || '&nbsp;') + '</p>';
        }).join('');
    },

    /* Texto visível, sem marcação — usado só para conferir contra os <w:t>
       do .docx. Mesma filtragem de "instrucao", mesma concatenação de runs e
       mesma limpeza de caractere de controle que Ooxml.documento usa, para
       as duas trilhas partirem do mesmo lugar. */
    textoPlano(doc) {
        return (doc.paragrafos || []).filter(p => p.destino !== 'instrucao')
            .map(p => (p.runs || []).map(r => U.semControle(r.texto == null ? '' : r.texto).texto).join(''))
            .join('\n');
    }
};

/* ==========================================================================
   [14] OOXML — a IR vira word/document.xml.
   Formatação DIRETA em cada parágrafo, sem w:pStyle.
   Essa escolha veio da peça real da vara, que também não usa estilos nomeados,
   e elimina de saída a pior armadilha do OOXML: um pStyle apontando para um
   estilo que não existe no styles.xml. O documento abre, sai com a formatação
   errada, e nada — nem o Word, nem o validador — acusa.
   ========================================================================== */
const Ooxml = {

    NS: 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"',

    /* Propriedades de parágrafo a partir do estilo declarado em formatacao.json.
       Ordem dos filhos de w:pPr importa para o schema: pStyle, ..., spacing,
       ind, jc. Fora de ordem, o Word recusa o arquivo. */
    pPr(nomeEstilo) {
        const e = (DADOS.formatacao.estilos || {})[nomeEstilo] || DADOS.formatacao.estilos.corpo;
        const el = DADOS.formatacao.entrelinha;

        let x = '<w:pPr>';
        x += '<w:spacing w:before="' + (e.espacoAntesTwips || 0) + '"' +
                      ' w:after="'  + (e.espacoDepoisTwips || 0) + '"' +
                      ' w:line="'   + el.linhaTwips + '" w:lineRule="' + el.regra + '"/>';

        const recEsq = e.recuoEsquerdaTwips || 0;
        const recPri = e.recuoPrimeiraLinhaTwips || 0;
        if (recEsq || recPri) {
            x += '<w:ind w:left="' + recEsq + '"';
            /* Recuo negativo em OOXML é w:hanging, com o valor em positivo. */
            x += recPri < 0 ? ' w:hanging="' + Math.abs(recPri) + '"'
                            : ' w:firstLine="' + recPri + '"';
            x += '/>';
        }

        x += '<w:jc w:val="' + (e.alinhamento || 'both') + '"/>';
        return x + '</w:pPr>';
    },

    rPr(run, nomeEstilo) {
        const e = (DADOS.formatacao.estilos || {})[nomeEstilo] || DADOS.formatacao.estilos.corpo;
        const f = DADOS.formatacao.fonte;
        const negrito = run.negrito || e.negrito;

        let x = '<w:rPr>';
        x += '<w:rFonts w:ascii="' + U.escXml(f.familia) + '" w:hAnsi="' + U.escXml(f.familia) +
             '" w:cs="' + U.escXml(f.familia) + '"/>';
        if (negrito)     x += '<w:b/><w:bCs/>';
        if (run.italico) x += '<w:i/><w:iCs/>';
        if (run.realce)  x += '<w:highlight w:val="yellow"/>';
        x += '<w:sz w:val="' + f.tamanhoMeioPonto + '"/><w:szCs w:val="' + f.tamanhoMeioPonto + '"/>';
        x += '<w:lang w:val="pt-BR"/>';
        return x + '</w:rPr>';
    },

    /* Um run. A quebra de linha interna vira <w:br/> — sem isso, um textoLongo
       colado com Enter sai como um parágrafo único e ilegível. */
    run(r, nomeEstilo) {
        const partes = String(r.texto == null ? '' : r.texto).split('\n');
        let x = '<w:r>' + Ooxml.rPr(r, nomeEstilo);
        partes.forEach((p, i) => {
            if (i > 0) x += '<w:br/>';
            /* xml:space="preserve" SEMPRE. Sem ele o Word come o espaço final e
               a peça sai com "art. 1.022do CPC". */
            x += '<w:t xml:space="preserve">' + U.escXml(p) + '</w:t>';
        });
        return x + '</w:r>';
    },

    paragrafo(p) {
        const runs = (p.runs || []).filter(r => r && r.texto !== '' && r.texto != null);
        let x = '<w:p>' + Ooxml.pPr(p.estilo);
        /* Parágrafo sem run é legítimo (linha em branco) e precisa sair como
           <w:p> vazio, não ser suprimido: a peça perderia o respiro. */
        runs.forEach(r => { x += Ooxml.run(r, p.estilo); });
        return x + '</w:p>';
    },

    /* Ordem dos filhos de w:sectPr é fixada pelo schema:
       pgSz → pgMar → pgNumType → cols → docGrid. Por isso vive numa string
       única, e não em concatenação condicional livre. */
    sectPr() {
        const pg = DADOS.formatacao.pagina;
        const m  = DADOS.formatacao.margensTwips;
        return '<w:sectPr>' +
            '<w:pgSz w:w="' + pg.larguraTwips + '" w:h="' + pg.alturaTwips +
                  '" w:orient="' + pg.orientacao + '"/>' +
            '<w:pgMar w:top="' + m.superior + '" w:right="' + m.direita +
                   '" w:bottom="' + m.inferior + '" w:left="' + m.esquerda +
                   '" w:header="' + m.cabecalho + '" w:footer="' + m.rodape + '" w:gutter="0"/>' +
            '<w:cols w:space="708"/>' +
            '<w:docGrid w:linePitch="360"/>' +
            '</w:sectPr>';
    },

    /* A IR inteira. Parágrafos com destino 'instrucao' ficam de fora: são as
       INSTRUÇÕES DE USO, que orientam o assistente e não integram a peça. */
    documento(doc) {
        const uteis = doc.paragrafos.filter(p => p.destino !== 'instrucao');
        let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
        x += '<w:document ' + Ooxml.NS + '><w:body>';
        uteis.forEach(p => { x += Ooxml.paragrafo(p); });
        x += Ooxml.sectPr();
        return x + '</w:body></w:document>';
    }
};

/* ==========================================================================
   [15] PACOTE — as oito partes do .docx.
   O [Content_Types].xml é gerado A PARTIR DA MESMA LISTA que alimenta o ZIP.
   Montar as duas à mão é como se produz o "O Word encontrou conteúdo
   ilegível": um Override sem parte, ou uma parte sem Override.
   ========================================================================== */
const Pacote = {

    CT: {
        doc:      'application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml',
        estilos:  'application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml',
        config:   'application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml',
        core:     'application/vnd.openxmlformats-package.core-properties+xml',
        app:      'application/vnd.openxmlformats-officedocument.extended-properties+xml'
    },

    cab: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',

    /* styles.xml só com docDefaults e o estilo Normal.
       Como a formatação é direta, este arquivo existe para o Word ter um padrão
       coerente ao qual voltar — não para os parágrafos apontarem para ele. */
    estilos() {
        const f  = DADOS.formatacao.fonte;
        const el = DADOS.formatacao.entrelinha;
        return Pacote.cab +
            '<w:styles ' + Ooxml.NS + '>' +
            '<w:docDefaults>' +
                '<w:rPrDefault><w:rPr>' +
                    '<w:rFonts w:ascii="' + U.escXml(f.familia) + '" w:hAnsi="' + U.escXml(f.familia) +
                          '" w:cs="' + U.escXml(f.familia) + '"/>' +
                    '<w:sz w:val="' + f.tamanhoMeioPonto + '"/>' +
                    '<w:szCs w:val="' + f.tamanhoMeioPonto + '"/>' +
                    '<w:lang w:val="pt-BR" w:eastAsia="pt-BR" w:bidi="ar-SA"/>' +
                '</w:rPr></w:rPrDefault>' +
                '<w:pPrDefault><w:pPr>' +
                    '<w:spacing w:after="0" w:line="' + el.linhaTwips + '" w:lineRule="' + el.regra + '"/>' +
                    '<w:jc w:val="both"/>' +
                '</w:pPr></w:pPrDefault>' +
            '</w:docDefaults>' +
            '<w:style w:type="paragraph" w:default="1" w:styleId="Normal">' +
                '<w:name w:val="Normal"/><w:qFormat/>' +
            '</w:style>' +
            '</w:styles>';
    },

    config() {
        return Pacote.cab +
            '<w:settings ' + Ooxml.NS + '>' +
            '<w:zoom w:percent="100"/>' +
            '<w:defaultTabStop w:val="708"/>' +
            '<w:characterSpacingControl w:val="doNotCompress"/>' +
            '<w:decimalSymbol w:val=","/><w:listSeparator w:val=";"/>' +
            '</w:settings>';
    },

    /* Propriedades do documento.
       Regra de privacidade: NADA de dado pessoal entra aqui. O título é o tipo
       da peça, não o nome de quem litiga; dc:subject leva o número do processo
       apenas quando o feito não corre em segredo de justiça. */
    core(meta) {
        const carimbo = U.carimboUtc(meta.geradoEm);
        return Pacote.cab +
            '<cp:coreProperties' +
            ' xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"' +
            ' xmlns:dc="http://purl.org/dc/elements/1.1/"' +
            ' xmlns:dcterms="http://purl.org/dc/terms/"' +
            ' xmlns:dcmitype="http://purl.org/dc/dcmitype/"' +
            ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
            '<dc:title>' + U.escXml(meta.titulo || '') + '</dc:title>' +
            '<dc:subject>' + U.escXml(meta.assunto || '') + '</dc:subject>' +
            '<dc:creator>' + U.escXml(CONFIG.nome) + '</dc:creator>' +
            '<cp:lastModifiedBy>' + U.escXml(CONFIG.nome) + '</cp:lastModifiedBy>' +
            '<dcterms:created xsi:type="dcterms:W3CDTF">' + carimbo + '</dcterms:created>' +
            '<dcterms:modified xsi:type="dcterms:W3CDTF">' + carimbo + '</dcterms:modified>' +
            '</cp:coreProperties>';
    },

    app() {
        return Pacote.cab +
            '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"' +
            ' xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
            '<Application>' + U.escXml(CONFIG.nome + ' ' + CONFIG.versao) + '</Application>' +
            '<Company></Company><DocSecurity>0</DocSecurity>' +
            '</Properties>';
    },

    relsRaiz() {
        return Pacote.cab +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Target="word/document.xml"' +
            ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"/>' +
            '<Relationship Id="rId2" Target="docProps/core.xml"' +
            ' Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties"/>' +
            '<Relationship Id="rId3" Target="docProps/app.xml"' +
            ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties"/>' +
            '</Relationships>';
    },

    /* Targets relativos a word/. Um Target absoluto ("/word/styles.xml") faz o
       Word ignorar os estilos sem reclamar de nada. */
    relsDoc() {
        return Pacote.cab +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Target="styles.xml"' +
            ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"/>' +
            '<Relationship Id="rId2" Target="settings.xml"' +
            ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings"/>' +
            '</Relationships>';
    },

    contentTypes(entradas) {
        let x = Pacote.cab +
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
            '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
            '<Default Extension="xml" ContentType="application/xml"/>';
        entradas.forEach(e => {
            if (e.contentType) {
                x += '<Override PartName="/' + e.caminho + '" ContentType="' + e.contentType + '"/>';
            }
        });
        return x + '</Types>';
    },

    /* A lista única. Toda entrada com contentType ganha Override; as .rels são
       cobertas pelo Default. Acrescentar uma parte aqui basta — o
       [Content_Types].xml se ajusta sozinho. */
    entradas(doc, meta) {
        return [
            { caminho: '_rels/.rels',              conteudo: Pacote.relsRaiz()      },
            { caminho: 'docProps/core.xml',        conteudo: Pacote.core(meta),      contentType: Pacote.CT.core    },
            { caminho: 'docProps/app.xml',         conteudo: Pacote.app(),           contentType: Pacote.CT.app     },
            { caminho: 'word/_rels/document.xml.rels', conteudo: Pacote.relsDoc()   },
            { caminho: 'word/document.xml',        conteudo: Ooxml.documento(doc),   contentType: Pacote.CT.doc     },
            { caminho: 'word/styles.xml',          conteudo: Pacote.estilos(),       contentType: Pacote.CT.estilos },
            { caminho: 'word/settings.xml',        conteudo: Pacote.config(),        contentType: Pacote.CT.config  }
        ];
    },

    montar(doc, meta) {
        const entradas = Pacote.entradas(doc, meta);
        /* O [Content_Types].xml é a primeira entrada do ZIP por convenção, e
           é derivado da lista — nunca escrito à mão em paralelo. */
        return [{ caminho: '[Content_Types].xml', conteudo: Pacote.contentTypes(entradas) }]
               .concat(entradas);
    }
};

/* ==========================================================================
   [16] DOCX — entradas → ZIP → Blob → download.
   ========================================================================== */
const Docx = {

    async blob(doc, meta) {
        if (typeof JSZip === 'undefined') {
            throw new Error('biblioteca-ausente');
        }
        const zip = new JSZip();
        Pacote.montar(doc, meta).forEach(e => {
            /* date fixa: geração determinística (ver CONFIG.dataZipFixa).
               createFolders:false evita entradas de diretório, que alguns
               leitores estritos recusam. */
            zip.file(e.caminho, e.conteudo, { date: CONFIG.dataZipFixa, createFolders: false });
        });
        return zip.generateAsync({
            type: 'blob',
            mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 },
            /* streamFiles:true grava data descriptors; o Word abre, mas o
               Apache POI — que é o que roda no backend do PJe — recusa. */
            streamFiles: false
        });
    },

    nomeArquivo(meta) {
        const p = [
            'Minuta',
            U.slug(meta.tipoPeca || 'peca'),
            meta.processoParaNome ? U.slug(meta.processoParaNome) : null,
            U.isoDeData(meta.geradoEm).split('-').join('')
        ].filter(Boolean);
        return p.join('_') + '.docx';
    },

    async baixar(doc, meta) {
        const b = await Docx.blob(doc, meta);
        U.baixar(b, Docx.nomeArquivo(meta));
        return b;
    }
};

/* ==========================================================================
   [24] TESTES — arnês.
   Roda com ?debug=1. As mesmas asserções rodam em tools/conferir-docx.mjs,
   fora do navegador, para que o build reprove antes de o arquivo chegar a
   alguém.
   ========================================================================== */
const Testes = {

    casos: [],
    def(nome, fn) { Testes.casos.push({ nome, fn }); },

    async rodar() {
        const res = [];
        for (const c of Testes.casos) {
            try { await c.fn(); res.push({ nome: c.nome, ok: true }); }
            catch (e) { res.push({ nome: c.nome, ok: false, motivo: e && e.message ? e.message : String(e) }); }
        }
        return res;
    },

    ok(cond, msg) { if (!cond) throw new Error(msg || 'asserção falhou'); },
    igual(a, b, msg) {
        if (a !== b) throw new Error((msg || 'diferente') + ' — esperado ' + JSON.stringify(b) + ', veio ' + JSON.stringify(a));
    },

    /* Documento de conferência: exercita cada estilo, o negrito, o itálico,
       o espaço nas bordas do texto e um caractere de controle. */
    docExemplo() {
        const o = DADOS.orgaos.orgaos[CONFIG.orgaoPadrao];
        const p = (estilo, texto, extra) => ({
            id: 'p' + Math.random().toString(36).slice(2, 8),
            estilo, destino: 'peca',
            runs: [Object.assign({ texto }, extra || {})]
        });

        const paras = [];
        o.cabecalho.forEach(l => paras.push(p('tituloCentro', l)));
        paras.push(p('autuacao', 'Processo nº: 0700000-06.2025.8.07.0016'));
        paras.push(p('autuacao', 'Classe judicial: Cumprimento de Sentença contra a Fazenda Pública'));
        paras.push(p('vazio', ''));
        paras.push(p('secao', 'S E N T E N Ç A'));
        paras.push(p('subsecao', 'I – RELATÓRIO'));
        paras.push({
            id: 'misto', estilo: 'corpo', destino: 'peca',
            runs: [
                { texto: 'Dispensado o relatório, nos termos do ' },
                { texto: 'art. 38 da Lei nº 9.099/1995', negrito: true },
                { texto: ', aplicável por força do art. 27 da Lei nº 12.153/2009.' }
            ]
        });
        /* Espaço nas bordas e caractere de controle: os dois casos que quebram
           o pacote de formas difíceis de diagnosticar. */
        paras.push(p('corpo', ' texto com espaço nas bordas e um VT \u000B aqui '));
        paras.push(p('alinea', 'a) NÃO CONHEÇO dos embargos de declaração, por manifesta inadmissibilidade;'));
        paras.push(p('alinea', 'b) DECLARO o caráter manifestamente protelatório da oposição.'));
        paras.push(p('fecho', 'Publique-se. Registre-se. Intimem-se.'));
        paras.push(p('assinatura', o.local + ', ' + U.dataExtenso(new Date())));
        paras.push(p('assinatura', '[Nome do magistrado] – ' + o.cargoPadrao));
        paras.push({
            id: 'instr', estilo: 'corpo', destino: 'instrucao',
            runs: [{ texto: 'INSTRUÇÕES DE USO — este parágrafo NÃO pode aparecer no .docx.' }]
        });

        return { paragrafos: paras };
    },

    metaExemplo() {
        return {
            titulo: 'Minuta de conferência — MINUTAR',
            assunto: '', tipoPeca: 'sentenca',
            processoParaNome: '0700000-06.2025.8.07.0016',
            geradoEm: new Date(Date.UTC(2026, 8, 10, 12, 0, 0))
        };
    },

    /* Modelo sintético da Fase 2 — exercita texto com placeholder, escolha,
       quando e grupoAlineas. Não é curadoria oficial: não vive em
       dados/modelos/ e não passa por validar-modelos.mjs. A conversão das
       4 rotas reais (Gerador de Sentencas) é Fase 3, à parte. */
    modeloExemplo() {
        return {
            id: 'exemplo_fase2',
            corpo: [
                { id: 'titulo', estilo: 'tituloCentro', texto: '**{{@orgao}}**' },
                { id: 'autuacao', estilo: 'autuacao', texto: 'Processo nº: {{processo}}' },
                { id: 'relato', estilo: 'corpo',
                  texto: 'A parte autora, {{autor|sintetico}}, pede {{objeto}}, com base em {{fundamento}}.' },
                { id: 'tutela', estilo: 'corpo',
                  escolha: { campo: 'temTutela',
                             casos: [{ valor: true, texto: 'Houve concessão de tutela de urgência neste feito.' }],
                             padrao: 'Não houve concessão de tutela de urgência neste feito.' } },
                { id: 'constricao', estilo: 'corpo', quando: { campo: 'temConstricao', igual: true },
                  texto: 'Registra-se a existência de constrição a levantar.' },
                { id: 'comandos', tipo: 'grupoAlineas', filhos: [

                    { id: 'mp', estilo: 'alinea', texto: '{{@alinea:mp}}) dê-se ciência ao Ministério Público;' },
                    { id: 'constricao_alinea', estilo: 'alinea', quando: { campo: 'temConstricao', igual: true },
                      texto: '{{@alinea:constricao_alinea}}) expeça-se o necessário ao levantamento da constrição;' },
                    { id: 'arquivamento', estilo: 'alinea',
                      texto: '{{@alinea:arquivamento}}) certificado o trânsito em julgado, arquive-se.' }
                ] },
                { id: 'assinatura', estilo: 'assinatura', texto: '{{@local}}, {{@hoje}}.' }
            ]
        };
    },

    valoresExemplo(variante) {
        const base = {
            processo: '0700000-06.2025.8.07.0016',
            autor: { nome: 'Fulano de Tal', sintetico: 'o autor' },

            fundamento: 'art. 196 da Constituição Federal',

        };

        if (variante === 'c') return Object.assign({}, base, {

    },

    opcoesExemplo() {

            orgao: DADOS.orgaos.orgaos[CONFIG.orgaoPadrao],
            magistrado: '[Nome do magistrado]',
            hoje: new Date(Date.UTC(2026, 8, 10, 12, 0, 0))
        };
    },

    /* Valores de exemplo para o primeiro modelo real da curadoria
       (procedencia_confirmacao_tutela) — só existe depois do build; ver o

        const cor = { a: 'vermelho', b: 'amarelo', c: 'verde', d: 'azul' }[variante] || 'vermelho';

       (extincao_falta_interesse) — uma variante por causa. */

       (extincao_cumprimento_satisfacao) — com e sem constrição. */

        };
        if (comConstricao) return Object.assign({}, base, { id_constricao: '65656565', valor_constricao: 1234.5 });
        return base;
    },

    /* Extrai o texto visível de um word/document.xml já montado, para
       conferir contra Previa.textoPlano(doc) — as duas trilhas do mesmo IR. */
    textoDoXml(xml) {
        const corpo = xml.slice(xml.indexOf('<w:body>') + 8, xml.indexOf('<w:sectPr'));
        const paragrafos = corpo.split('<w:p>').slice(1).map(b => b.split('</w:p>')[0]);
        const desxml = s => s
            .split('<w:br/>').join('\n')
            .replace(/<[^>]+>/g, '')
            .split('&amp;').join('&').split('&lt;').join('<').split('&gt;').join('>')
            .split('&quot;').join('"').split('&apos;').join("'");
        return paragrafos.map(desxml).join('\n');
    }
};

    Testes.ok(Cond.avaliar({ campo: 'x', igual: true }, { x: true }), 'igual booleano');

/* ==========================================================================
   [18] VITRINE — um cartão por modelo em MODELOS, para o assistente escolher
   qual usar. Lê metadados.titulo e aplicabilidade; não filtra nem busca
   ainda — com 4 modelos, uma lista já é a interface.
   ========================================================================== */
const Vitrine = {

    /* 4 tons suaves, de baixa saturação — só para diferenciar um cartão do
       outro à distância, não para carregar a tela. Ciclam por índice; com
       mais de 4 modelos, a cor se repete, e não tem problema nisso. */
    CORES: 4,

    renderizar() {
        if (!MODELOS.length) {
            return '<p class="legenda">Nenhum modelo carregado — rode <code>npm run build</code> depois de ' +
                   'acrescentar um arquivo em <code>dados/modelos/</code>.</p>';
        }
        return '<div class="vitrine-grade">' + MODELOS.map(Vitrine.cartao).join('') + '</div>';
    },

    cartao(modelo, indice) {
        const md = modelo.metadados || {};
        const pontos = (modelo.aplicabilidade || []).map(a => '<li>' + U.esc(a) + '</li>').join('');
        const cor = (indice % Vitrine.CORES) + 1;
        return '<article class="modelo-cartao cor-' + cor + '">' +
               '<h3>' + U.esc(md.titulo || modelo.id) + '</h3>' +
               (pontos ? '<ul>' + pontos + '</ul>' : '') +
               '<div class="linha-btn"><button class="btn" data-usar-modelo="' + U.esc(modelo.id) + '">' +
               'Usar este modelo</button></div>' +
               '</article>';
    }
};
