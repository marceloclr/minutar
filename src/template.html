             '</section>';

        alvo.innerHTML = h;

        document.getElementById('vitrine').addEventListener('click', App.aoClicarVitrine);
        document.getElementById('formCampos').addEventListener('change', App.aoMudarCampoForm);
        document.getElementById('formCampos').addEventListener('input', App.aoDigitarCampo);
        document.getElementById('btnGerarForm').addEventListener('click', App.gerarForm);
        document.getElementById('btnPreviaForm').addEventListener('click', App.previaForm);
        document.getElementById('btnVoltarVitrine').addEventListener('click', App.voltarVitrine);

        document.getElementById('btnGerar').addEventListener('click', App.gerar);
        document.getElementById('btnPrevia').addEventListener('click', App.previaExemplo);
        document.getElementById('btnTestes').addEventListener('click', App.testar);

        if (depurar) App.testar();
    },

    /* --- Vitrine → Form --------------------------------------------------- */

    aoClicarVitrine(ev) {
        const btn = ev.target.closest('[data-usar-modelo]');
        if (!btn) return;
        App.abrirModelo(btn.getAttribute('data-usar-modelo'));
    },

    abrirModelo(id) {
        const modelo = MODELOS.find(m => m.id === id);
        if (!modelo) return;
        App.estado = { modeloId: id, valores: {}, tentouGerar: false };
        App.renderizarForm(modelo);
        const cartao = document.getElementById('cartaoForm');
        cartao.hidden = false;
        cartao.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },

    voltarVitrine() {
        document.getElementById('cartaoForm').hidden = true;
        document.getElementById('vitrine').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },

    renderizarForm(modelo) {
        const md = modelo.metadados || {};
        document.getElementById('formTitulo').textContent = md.titulo || modelo.id;
        document.getElementById('formLegenda').textContent =
            (modelo.aplicabilidade || []).join(' ') || 'Preencha os campos abaixo.';

        const pendentesIds = App.estado.tentouGerar
            ? Form.pendencias(modelo, App.estado.valores).map(c => c.id) : [];
        document.getElementById('formCampos').innerHTML = Form.renderizarCampos(modelo, App.estado.valores, pendentesIds);
    },

    /* "change", não "input": os campos que controlam mostrarQuando são
       select/checkbox (disparam na hora); texto livre só reflete na
       próxima vez que perder o foco — reconstruir a tela a cada tecla
       digitada derrubaria o cursor do campo de texto sem necessidade. */
    aoMudarCampoForm() {
        const modelo = MODELOS.find(m => m.id === App.estado.modeloId);
        if (!modelo) return;
        App.estado.valores = Form.coletarValores(modelo, App.estado.valores);
        App.renderizarForm(modelo);
    },

    /* "input": crítica ao vivo, campo por campo, sem reconstruir a tela —
       só essa div. Mantém o cursor onde o assistente está digitando, ao
       contrário do "change" acima (que precisa reconstruir para
       mostrarQuando reagir, mas só troca de estado depois que o campo já
       perdeu o foco). */
    aoDigitarCampo(ev) {
        const el = ev.target;
        if (!el.name) return;
        const modelo = MODELOS.find(m => m.id === App.estado.modeloId);
        if (!modelo) return;
        const campo = (modelo.campos || []).find(c => c.id === el.name);
        if (!campo) return;

        /* Campos.mascarar devolve o bruto sem alterar quando o tipo não tem
           máscara — chamar sempre aqui é seguro e evita duplicar a lista de
           quais tipos mascaram entre este arquivo e Campos. */
        const posAntes = el.selectionStart, tamAntes = el.value.length;
        const mascarado = Campos.mascarar(campo, el.value);
        if (mascarado !== el.value) {
            el.value = mascarado;
            const delta = el.value.length - tamAntes;
            el.selectionStart = el.selectionEnd = Math.max(0, posAntes + delta);
        }

        const r = Campos.validar(campo, el.value);
        const wrap = el.closest('.campo');
        if (wrap) wrap.classList.toggle('invalido', !r.valido);
        const erro = document.getElementById('erro_' + campo.id);
        if (erro) erro.textContent = r.mensagem;
    },

    orgaoDoModelo(modelo) {
        const orgaos = DADOS.orgaos.orgaos || {};
        return orgaos[(modelo.metadados || {}).orgao] || orgaos[CONFIG.orgaoPadrao];
    },

    /* --- Prévia (compartilhada entre o Form e o card de conferência) ------ */

    mostrarPrevia(doc) {
        document.getElementById('folha').innerHTML = Previa.renderizar(doc);
        document.getElementById('cartaoPrevia').hidden = false;
        document.getElementById('cartaoPrevia').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },

    previaExemplo() {
        App.mostrarPrevia(Testes.docExemplo());
    },

    previaForm() {
        const modelo = MODELOS.find(m => m.id === App.estado.modeloId);
        if (!modelo) return;
        const doc = Montagem.montarDocumento(modelo, App.estado.valores,
            { orgao: App.orgaoDoModelo(modelo), hoje: new Date() });
        App.mostrarPrevia(doc);
    },

    /* --- Geração ------------------------------------------------------------ */

    async gerarForm() {
        const modelo = MODELOS.find(m => m.id === App.estado.modeloId);
        if (!modelo) return;

        App.estado.valores = Form.coletarValores(modelo, App.estado.valores);
        App.estado.tentouGerar = true;
        App.renderizarForm(modelo);

        const pendentes = Form.pendencias(modelo, App.estado.valores);
        const saidaPend = document.getElementById('formPendencias');
        if (pendentes.length) {
            saidaPend.innerHTML = '<div class="aviso-caixa">Faltam preencher: <ul class="pendencias">' +
                pendentes.map(c => '<li>' + U.esc(c.rotulo) + '</li>').join('') + '</ul></div>';
            return;
        }
        saidaPend.innerHTML = '';

        const btn = document.getElementById('btnGerarForm');
        const saida = document.getElementById('saidaGerarForm');
        btn.disabled = true;
        U.escXml.removidos = 0;

        try {
            const doc = Montagem.montarDocumento(modelo, App.estado.valores,
                { orgao: App.orgaoDoModelo(modelo), hoje: new Date() });
            const md = modelo.metadados || {};
            const meta = {
                titulo: md.titulo || modelo.id,
                assunto: '',
                tipoPeca: md.tipoPeca || 'peca',
                processoParaNome: App.estado.valores.numero_processo,
                geradoEm: new Date()
            };
            const b = await Docx.baixar(doc, meta);
            const kb = (b.size / 1024).toFixed(1);
            let m = '<div class="aviso-caixa">Arquivo gerado — <strong>' + kb + ' KB</strong>. ' +
                    'Abra no Word ou no LibreOffice antes de anexar ao processo no PJe.';
            if (U.escXml.removidos > 0) {
                m += '<br><br>Foram retirados <strong>' + U.escXml.removidos + '</strong> caracteres invisíveis ' +
                     'que o formato do Word não aceita. O texto visível não mudou.';
            }
            saida.innerHTML = m + '</div>';
        } catch (e) {
            /* Nunca expor a mensagem técnica: ela não ajuda o assistente e assusta. */
            saida.innerHTML = '<div class="aviso-caixa">Não foi possível montar o arquivo neste navegador. ' +
                              'Verifique se o sistema foi aberto a partir do arquivo HTML completo entregue pelo gabinete.</div>';
        } finally {
            btn.disabled = false;
        }
    },

    async gerar() {
        const btn = document.getElementById('btnGerar');
        const saida = document.getElementById('saidaGerar');
        btn.disabled = true;
        U.escXml.removidos = 0;

        try {
            const b = await Docx.baixar(Testes.docExemplo(), Testes.metaExemplo());
            const kb = (b.size / 1024).toFixed(1);
            let m = '<div class="aviso-caixa">Arquivo gerado — <strong>' + kb + ' KB</strong>. ' +
                    'Abra no Word ou no LibreOffice e, em seguida, tente anexá-lo a um processo no PJe. ' +
                    'É esse anexo que valida a Fase 1.';
            if (U.escXml.removidos > 0) {
                m += '<br><br>Foram retirados <strong>' + U.escXml.removidos + '</strong> caracteres invisíveis ' +
                     'que o formato do Word não aceita. O texto visível não mudou.';
            }
            saida.innerHTML = m + '</div>';
        } catch (e) {
            /* Nunca expor a mensagem técnica: ela não ajuda o assistente e assusta. */
            saida.innerHTML = '<div class="aviso-caixa">Não foi possível montar o arquivo neste navegador. ' +
                              'Verifique se o sistema foi aberto a partir do arquivo HTML completo entregue pelo gabinete.</div>';
        } finally {
            btn.disabled = false;
        }
    },

    async testar() {
        const saida = document.getElementById('saidaTestes');
        saida.innerHTML = '<p>Executando…</p>';
        const res = await Testes.rodar();
        const falhas = res.filter(r => !r.ok);
        let h = '<p><strong>' + (res.length - falhas.length) + '/' + res.length + '</strong> ' +
                (falhas.length ? '<span class="falha">— ' + falhas.length + ' falha(s)</span>'
                               : '<span class="ok">— tudo verde</span>') + '</p><ol>';
        res.forEach(r => {
            h += '<li class="' + (r.ok ? 'ok' : 'falha') + '">' + (r.ok ? '✓ ' : '✗ ') + U.esc(r.nome) +
                 (r.ok ? '' : ' — ' + U.esc(r.motivo)) + '</li>';
        });
        saida.innerHTML = h + '</ol>';
    }
};
</script>
